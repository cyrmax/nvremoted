name: Set up Go and Mage
description: Restore Go caches and install the Mage version pinned in go.mod
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: .go-version
        cache: true
        cache-dependency-path: |
          go.mod
          go.sum
    - name: Install pinned Mage
      shell: bash
      run: |
        mage_version="$(go list -m -mod=readonly -f '{{.Version}}' github.com/magefile/mage)"
        GOBIN="$RUNNER_TEMP/mage-bin" go install "github.com/magefile/mage@$mage_version"
        printf '%s\n' "$RUNNER_TEMP/mage-bin" >> "$GITHUB_PATH"
